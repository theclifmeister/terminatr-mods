# Pit Wall's layout: the timing tower on the left, the telemetry along
# the bottom.
#
# The sidebar is the timing tower: on the left, 28% of the window (33
# cells at 120 columns, 56 at 200), its columns in a timing screen's
# order: the car's state (position), the flag (needs you), the sector
# (the PR's checks), the lap count (steps), the tyres (the mod's own
# column: context use), then remote, paused and inactive. The safety
# columns would show even if left out. The race order goes under each
# project's threads (mod API 1.7).
#
# The details panel is the telemetry: under the list, 35% of the height
# (14 rows at 40), the lap chart under the panel's own lines. Race
# control sits right after NEEDS YOU in the coordinator's panel. The
# dashboard puts the pit calls (mods' cards) before the sessions outside
# projects, so a card is never below the fold. The header, footer,
# status bar and rows keep their built-in style.
#
# Unlike cockpit (sidebar right, details 40%), compact (everything
# compact), zen (no sidebar), Spotlight (no sidebar, details right),
# Triage (slim sidebar right) and Mainframe (no header, compact rows,
# details 30%).
[sidebar]
columns = ["state", "needs", "ci", "count", "pit-wall.tyres", "remote", "paused", "inactive"]
side = "left"
width = "28%"
project_sections = ["pit-wall.order"]

[details]
place = "bottom"
size = "35%"
sections = ["core", "pit-wall.laps"]

[coordinator]
sections = ["needs", "pit-wall.control", "inbox", "threads", "deck"]

[dashboard]
sections = ["needs", "project", "cards", "other"]
