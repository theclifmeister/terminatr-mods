# Pit Wall: an F1 race-engineer total conversion. Threads are cars, the
# user is the race engineer on the pit wall. Data files: a
# carbon-and-papaya theme (with pane palettes), an icon set of tyres and
# flags, and a layout with the timing tower on the left and the
# telemetry along the bottom; pick each in Settings (General: Theme,
# Icons and Layout). Code: a tyre-wear column, the race order under each
# project, a lap chart in the details panel, race control in the
# coordinator's panel and a race results tab, all on once the mod is.
id = "pit-wall"
name = "Pit Wall"
version = "0.2.0"
api = "1.7"
min_tm = "0.25.3"
description = "An F1 pit wall: a carbon-and-papaya theme (pane palettes included), tyre-and-flag icons, a timing-tower layout, a tyre-wear column (each session's context window: soft, worn, BOX BOX), the race order under each project, a lap chart beside a thread, race control beside the coordinator and a race results tab. The tyre column needs the Agent mod on for Claude sessions."
authors = ["Clifmeister"]
homepage = "https://github.com/theclifmeister/terminatr-mods/tree/main/pit-wall"

[provides]
main = "main.ts"
theme = "theme.toml"
icons = "icons.toml"
layout = "layout.toml"

# Tyre wear: each session's context window, in the layout as
# pit-wall.tyres. Reads session.state, which for Claude sessions needs
# the Agent mod on (Settings, Agent mod, or [agent_mod] enabled = true).
[[provides.columns]]
id = "tyres"
title = "tyres"
width = 8
where = ["sidebar.thread", "sidebar.coordinator", "dashboard.thread"]

# The race order under each project: its threads, finished first, then
# the furthest along. Enter on its header opens the results tab.
[[provides.views]]
id = "order"
title = "race order"
slot = "sidebar.project.section"
opens = "results"
description = "this project's threads in race order; enter opens the race results"

# The lap chart: a thread's steps as laps and its PR as sectors, in the
# details panel and beside the thread's pane.
[[provides.views]]
id = "laps"
title = "Lap chart"
slot = "details.section"

# Race control beside the coordinator: flags, the inbox, merges.
[[provides.views]]
id = "control"
title = "Race control"
slot = "coordinator.section"

# Race results: the podium of done tasks and the merged pull requests.
[[provides.views]]
id = "results"
title = "Race results"
slot = "project.tab"

[permissions]
project_read = true
views = true

[settings.worn]
type = "int"
default = 60
min = 20
max = 90
label = "Tyres are worn from this % of the context window"

[settings.box]
type = "int"
default = 85
min = 50
max = 99
label = "BOX BOX (clear the conversation) from this %"
