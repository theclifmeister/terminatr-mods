# The double diamond's soft gates, opt-in per project. A rules file can't
# read a mod setting, and mod settings aren't per project, so the switch
# is where this mod runs: tm mod enable double-diamond-gates --project
# <slug>. Its house rules then reach that project's coordinator only.
id = "double-diamond-gates"
name = "Double diamond gates"
version = "1.0.0"
api = "1.0"
description = "Soft gates for the Double diamond playbook, opt-in per project (enable it with --project): the coordinator proposes no build (Deliver) task for a design still in Define or with open questions, and says what clears the gate instead. Needs the double-diamond mod."
authors = ["Clifmeister"]
homepage = "https://github.com/theclifmeister/terminatr-mods/tree/main/double-diamond-gates"

[provides.rules]
coordinator = "rules/coordinator.md"
