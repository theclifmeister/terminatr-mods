# A policy mod: house rules for the coordinator, added after tm's own
# policy (default-policy), and a task template per phase. It replaces
# nothing: tm's safety part comes first and default-policy stays whole.
# The soft gates are a section of the rules a project turns on with the
# "gates" setting (per-project settings and tm:if sections: mod API 1.11,
# tm 0.63.0). CI's pinned tm (0.63.0) validates it.
id = "double-diamond"
name = "Double diamond"
version = "2.0.0"
api = "1.11"
min_tm = "0.63.0"
description = "A coordinator playbook that runs a project through Discover, Define, Develop and Deliver in order, on top of tm's default policy: research tasks, one design per problem, parallel spikes per option, build tasks ordered with after. Adds a task template per phase and optional soft gates (setting gates, per project): no build task for a design still in Define."
authors = ["Clifmeister"]
homepage = "https://github.com/theclifmeister/terminatr-mods/tree/main/double-diamond"

[provides]
templates = "templates"

[provides.rules]
coordinator = "rules/coordinator.md"

# Off for every project until one turns it on: tm mod settings
# double-diamond --project <slug> gates=true. The gate rules are in a
# project's rules only then.
[settings.gates]
type    = "bool"
default = false
label   = "Gates: no build task for a design still in Define"
