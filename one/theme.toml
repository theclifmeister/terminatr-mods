# One (One Dark / One Light) over tm's roles. Each role is
# { fg, bg, bold, faint, reverse }; a colour pair is the ANSI fallback
# first, then the truecolor value.
#
# [dark] is One Dark, with the terminal palette of One Dark Pro
# (Binaryify/OneDark-Pro, theme OneDark-Pro.json, terminal.ansi*).
# [light] is One Light, from Atom's one-light-syntax colours
# (atom/atom, colors.less); Atom shipped no terminal palette, so the
# 16 ANSI slots are a mapping of those syntax colours (see README).
#
# Mapping: head/plain = foreground, sel = background on blue (dark) or
# purple (light), faint = bright black, accent = magenta, title = blue,
# bad = red, warn = yellow, good = green, info = cyan.

# One Dark
[dark]
head   = { fg = ["brightwhite", "#e6e6e6"], bold = true }
sel    = { fg = ["black", "#282c34"], bg = ["blue", "#4aa5f0"] }
faint  = { fg = ["brightblack", "#5c6370"] }
accent = { fg = ["magenta", "#c162de"] }
title  = { fg = ["blue", "#4aa5f0"], bold = true }
bad    = { fg = ["red", "#e05561"] }
warn   = { fg = ["yellow", "#d18f52"] }
good   = { fg = ["green", "#8cc265"] }
info   = { fg = ["cyan", "#42b3c2"] }
plain  = { fg = ["white", "#abb2bf"] }

[dark.pane]
fg = "#abb2bf"
bg = "#282c34"
palette = [
  "#3f4451", "#e05561", "#8cc265", "#d18f52", "#4aa5f0", "#c162de", "#42b3c2", "#d7dae0",
  "#4f5666", "#ff616e", "#a5e075", "#f0a45d", "#4dc4ff", "#de73ff", "#4cd1e0", "#e6e6e6",
]

# One Light
[light]
head   = { fg = ["black", "#383a42"], bold = true }
sel    = { fg = ["brightwhite", "#fafafa"], bg = ["magenta", "#a626a4"] }
faint  = { fg = ["brightblack", "#a0a1a7"] }
accent = { fg = ["magenta", "#a626a4"] }
title  = { fg = ["blue", "#4078f2"], bold = true }
bad    = { fg = ["red", "#e45649"] }
warn   = { fg = ["yellow", "#b76b01"] }
good   = { fg = ["green", "#50a14f"] }
info   = { fg = ["cyan", "#0184bc"] }
plain  = { fg = ["black", "#383a42"] }

[light.pane]
fg = "#383a42"
bg = "#fafafa"
palette = [
  "#383a42", "#e45649", "#50a14f", "#b76b01", "#4078f2", "#a626a4", "#0184bc", "#a0a1a7",
  "#696c77", "#ca1243", "#50a14f", "#b76b01", "#4078f2", "#a626a4", "#0184bc", "#fafafa",
]
